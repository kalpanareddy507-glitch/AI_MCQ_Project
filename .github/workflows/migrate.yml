name: Zero-Code Database Migration to Supabase

on:
  push:
    paths:
      - '**/exams_v3.db' # Triggers on any database updates
  workflow_dispatch: # Allows manual trigger button click

jobs:
  sync-to-supabase:
    runs-on: ubuntu-latest

    steps:
    - name: Checkout Code Repository
      uses: actions/checkout@v3

    - name: Set up Python Environment
      uses: actions/setup-python@v4
      with:
        python-version: '3.10'

    - name: Install Data Migration Tools
      run: |
        pip install pg_activity psycopg2-binary
        pip install sqlite3to-postgres

    - name: Verify SQLite File Exists
      run: |
        if [ ! -f "exams_v3.db" ]; then
          echo "⚠️ Error: exams_v3.db file not found in root directory!"
          exit 1
        fi

    - name: Stream Data into Supabase Cloud
      env:
        TARGET_URL: ${{ secrets.SUPABASE_DB_URL }}
      run: |
        # Using the direct schema conversion routine to inject data rows safely
        sqlite3to-postgres --sqlite-path ./exams_v3.db --postgres-uri "$TARGET_URL"