name: Zero-Code Database Migration to Supabase

on:
  push:
    paths:
      - '**/exams_v3.db'
  workflow_dispatch:

jobs:
  sync-to-supabase:
    runs-on: ubuntu-latest

    steps:
    - name: Checkout Code Repository
      uses: actions/checkout@v3

    - name: Set up Python Environment
      uses: actions/setup-python@v4
      with:
        python-version: '3.10'

    - name: Install Data Migration Tools
      run: |
        pip install psycopg2-binary

    - name: Database Migration Execution Stream
      env:
        DB_HOST: ${{ secrets.SUPABASE_DB_HOST }}
        DB_USER: ${{ secrets.SUPABASE_DB_USER }}
        DB_PASSWORD: ${{ secrets.SUPABASE_DB_PASSWORD }}
      run: |
        python -c "
        import os, sqlite3, psycopg2
         
        if not os.path.exists('exams_v3.db'):
            print('⚠️ Local database file exams_v3.db not found!')
            exit(0)

        print('Connecting safely to Supabase pooler host using explicit parameters...')
         
        sqlite_conn = sqlite3.connect('exams_v3.db')
        sqlite_cursor = sqlite_conn.cursor()
         
        try:
            # Connect using explicit keyword arguments to guarantee tenant identification
            pg_conn = psycopg2.connect(
                host=os.environ.get('DB_HOST'),
                user=os.environ.get('DB_USER'),
                password=os.environ.get('DB_PASSWORD'),
                dbname='postgres',
                port=6543,
                connect_timeout=20
            )
            pg_cursor = pg_conn.cursor()
            print('✅ Connected to Supabase Pooler successfully!')
        except Exception as conn_error:
            print(f'❌ Failed to establish link with Supabase: {conn_error}')
            sqlite_conn.close()
            exit(1)
         
        try:
            sqlite_cursor.execute(\"SELECT name FROM sqlite_master WHERE type='table';\")
            tables = [t[0] for t in sqlite_cursor.fetchall() if not t[0].startswith('sqlite_')]
             
            for table in tables:
                sqlite_cursor.execute(f'SELECT * FROM {table};')
                rows = sqlite_cursor.fetchall()
                if not rows:
                    continue
                 
                sqlite_cursor.execute(f'PRAGMA table_info({table});')
                cols = sqlite_cursor.fetchall()
                col_names = [c[1] for c in cols]
                 
                def get_pg_type(sqlite_type):
                    s_type = sqlite_type.upper()
                    if 'INT' in s_type: return 'INTEGER'
                    if 'REAL' in s_type or 'FLOA' in s_type: return 'TEXT'
                    return 'TEXT'

                pg_cursor.execute(f'DROP TABLE IF EXISTS public.\"{table}\" CASCADE;')
                 
                col_defs = ', '.join([f'\"{c[1]}\" {get_pg_type(c[2])}' for c in cols])
                pg_cursor.execute(f'CREATE TABLE public.\"{table}\" ({col_defs});')
                 
                placeholders = ', '.join(['%s'] * len(col_names))
                col_string = ', '.join([f'\"{c}\"' for c in col_names])
                 
                for row in rows:
                    pg_cursor.execute(f'INSERT INTO public.\"{table}\" ({col_string}) VALUES ({placeholders});', row)
                print(f'Syncing complete for table: {table}')
                     
            pg_conn.commit()
            print('🎉 All data records have successfully mirrored over to your Supabase instance!')
        except Exception as e:
            print(f'Migration encountered an error: {e}')
            pg_conn.rollback()
        finally:
            sqlite_conn.close()
            pg_conn.close()
        "