name: Zero-Code Database Migration to Supabase

on:
  push:
    paths:
      - '**/exams_v3.db'
  workflow_dispatch:

jobs:
  sync-to-supabase:
    runs-on: ubuntu-latest

    steps:
    - name: Checkout Code Repository
      uses: actions/checkout@v3

    - name: Set up Python Environment
      uses: actions/setup-python@v4
      with:
        python-version: '3.10'

    - name: Install Data Migration Tools
      run: |
        pip install psycopg2-binary sqlite3to-postgres

    - name: Pre-Create PostgreSQL Target Tables
      env:
        TARGET_URL: ${{ secrets.SUPABASE_DB_URL }}
      run: |
        python -c "
        import os, psycopg2
        conn = psycopg2.connect('$TARGET_URL')
        cursor = conn.cursor()
        
        # Create source_documents table schema
        cursor.execute('''
        CREATE TABLE IF NOT EXISTS source_documents (
            document_id UUID PRIMARY KEY,
            raw_text TEXT NOT NULL,
            processed_at TIMESTAMP DEFAULT NOW()
        );
        ''')
        
        # Create generated_mcqs table schema 
        cursor.execute('''
        CREATE TABLE IF NOT EXISTS generated_mcqs (
            question_id UUID PRIMARY KEY,
            document_id UUID REFERENCES source_documents(document_id) ON DELETE CASCADE,
            question_text TEXT NOT NULL,
            correct_answer VARCHAR(255) NOT NULL,
            distractors JSONB NOT NULL,
            difficulty VARCHAR(50)
        );
        ''')
        
        conn.commit()
        cursor.close()
        conn.close()
        print('✅ Supabase target table structures verified successfully!')
        "

    - name: Stream Data into Supabase Cloud
      env:
        TARGET_URL: ${{ secrets.SUPABASE_DB_URL }}
      run: |
        # Explicitly stream table rows to matching columns
        sqlite3to-postgres --sqlite-path ./exams_v3.db --postgres-uri "$TARGET_URL"